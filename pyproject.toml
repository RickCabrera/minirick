[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minirick"
version = "0.1.0"
description = "Copiloto de terminal con contexto compartido para equipos"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Rick Cabrera" },
]
license = { text = "MIT" }
keywords = ["cli", "productivity", "team", "copilot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pywebview>=5.0",
    "supabase>=2.5.0",
    "python-dotenv>=1.0.0",
    "platformdirs>=4.2.0",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4.0",
]

[project.scripts]
minirick = "minirick.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/minirick"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
